spring.application.name=exercise2025

# --- MySQL connection (matches docker-compose.yml) ---
spring.datasource.url=jdbc:mysql://localhost:3306/pets
spring.datasource.username=petsuser
spring.datasource.password=petssecret

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
